name: Create public FXMuse update release

on:
  push:
    branches: [main]
    paths:
      - 'updates/**'
      - 'latest.json'

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'publish: v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create or update public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_SHA}"
          tag=$(git log -1 --pretty=%B | sed -n 's/^publish: \(v[0-9][0-9.]*\)$/\1/p')
          test -n "$tag"
          version="${tag#v}"
          installer=$(find "updates/$tag" -maxdepth 1 -name '*-setup.exe' -print -quit)
          signature="${installer}.sig"
          test -n "$installer" && test -f "$signature" && test -f "latest.json"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$installer" "$signature" --clobber
          else
            gh release create "$tag" "$installer" "$signature" \
              --title "FXMuse $version" \
              --notes-file "updates/$tag/RELEASE_NOTES.md" \
              --latest
          fi